{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-mariadb-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: mariadb}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [wikibase, job-runner{{ if ne .Values.profile "none" }}, rdf-snapshot, semantic-fixture, post-promotion-fixture{{ end }}]}
      ports: [{protocol: TCP, port: 3306}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-core-database-egress}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [wikibase, job-runner{{ if ne .Values.profile "none" }}, rdf-snapshot, semantic-fixture, post-promotion-fixture{{ end }}]}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: mariadb}}}]
      ports: [{protocol: TCP, port: 3306}]
{{- if ne .Values.profile "none" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-wikibase-query-readers}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: wikibase}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [rdf-source-reader, rdf-sync-worker-a, rdf-sync-worker-b, rdf-snapshot, semantic-fixture, post-promotion-fixture, snapshot-race-edit]}
      ports: [{protocol: TCP, port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-query-source-egress}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [rdf-source-reader, rdf-sync-worker-a, rdf-sync-worker-b, rdf-snapshot, semantic-fixture, post-promotion-fixture, snapshot-race-edit]}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: wikibase}}}]
      ports: [{protocol: TCP, port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-query-control-postgresql}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: postgresql}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [migration, bootstrap, rdf-source-reader, rdf-sync-worker-a, rdf-sync-worker-b, query-router, rdf-coordinator]}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-query-control-egress}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [migration, bootstrap, rdf-source-reader, rdf-sync-worker-a, rdf-sync-worker-b, query-router, rdf-coordinator]}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: postgresql}}}]
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-virtuoso-a-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: virtuoso-a}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [rdf-sync-worker-a, query-router, rdf-coordinator]}
      ports: [{protocol: TCP, port: 8890}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-virtuoso-b-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: virtuoso-b}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [rdf-sync-worker-b, query-router, rdf-coordinator]}
      ports: [{protocol: TCP, port: 8890}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-backend-egress}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [rdf-sync-worker-a, rdf-sync-worker-b, query-router, rdf-coordinator]}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [virtuoso-a, virtuoso-b]}
      ports: [{protocol: TCP, port: 8890}]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: public-http}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [wikibase{{ if ne .Values.profile "none" }}, query-router{{ end }}]}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: {{ .Values.service.wikibase.port }}}
        {{- if ne .Values.profile "none" }}
        - {protocol: TCP, port: 19200}
        {{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-acme-http01-solver
  labels: {{- include "custom-wikibase.labels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {acme.cert-manager.io/http01-solver: "true"}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: 8089}]
{{- end }}
{{- end }}
