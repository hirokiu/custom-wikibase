{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: core-flows}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: custom-wikibase}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: custom-wikibase}}}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: custom-wikibase}}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: public-http}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [wikibase{{ if eq .Values.profile "virtuoso" }}, query-router{{ end }}]}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: {{ .Values.service.wikibase.port }}}
        {{- if eq .Values.profile "virtuoso" }}
        - {protocol: TCP, port: 19200}
        {{- end }}
{{- end }}
