profile: none

images:
  core:
    repository: japan-wikibase/core
    tag: 0.1.0-rc.1
    pullPolicy: IfNotPresent
  runtime:
    repository: japan-wikibase/runtime
    tag: 0.1.0-rc.1
    pullPolicy: IfNotPresent
  snapshotProducer:
    repository: japan-wikibase/snapshot-producer
    tag: 0.1.0-rc.1
    pullPolicy: IfNotPresent
  mariadb: mariadb:10.11.14@sha256:dbe56e20372fc6d6b8e0e396866ba89c4c7f128c38c4f59aaa54d957db95790c
  postgresql: postgres:16.9-bookworm@sha256:253815cf7579ffa05e1673d92e78d37273e61be0e4414e9a1449337d7925be94
  virtuoso: openlink/virtuoso-opensource-7:7.2.17@sha256:0dbe1ab4fa0cb7bbafc1f6c0c2b0a5d6f22d918dbd17672f2ddb24580aa6756a
  fuseki: japan-wikibase/fuseki:6.1.0
  oxigraph: oxigraph/oxigraph:0.5.7@sha256:fa3a660c0f5ec776472c0828309dec8a5410b7267e2dcac59ab7d7f29e10da28

existingSecret: custom-wikibase-secrets
queryExistingSecret: custom-wikibase-query-secrets
canonicalPublicUrl: http://127.0.0.1:8280
trustedInternalSourceUrl: http://wikibase
publicQueryUrl: http://127.0.0.1:8290/sparql
siteName: Japan Wikibase
timezone: Asia/Tokyo

# Legacy defaults preserve the standalone Compose contract. Kubernetes instances
# must override all three with values derived from their stable instance UUID.
identities:
  instanceId: 00000000-0000-4000-8000-000000000001
  sourceIdentity: jwb-standalone
  queryServiceId: jwb-standalone-query

service:
  wikibase:
    type: ClusterIP
    port: 80
  queryRouter:
    type: ClusterIP
    port: 19200

workers:
  a: {replicas: 1}
  b: {replicas: 1}

storage:
  className: ""
  mariadb: 2Gi
  uploads: 1Gi
  runtimeState: 256Mi
  postgresql: 1Gi
  virtuoso: 2Gi
  fuseki: 2Gi
  oxigraph: 2Gi
  snapshots: 1Gi

resources:
  core: {}
  jobRunner: {}
  mariadb: {}
  runtime: {}
  postgresql: {}
  virtuoso: {}
  fuseki: {}
  oxigraph: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false

networkPolicy:
  enabled: true

ingress:
  enabled: false
  className: traefik
  hostname: localhost
  clusterIssuer: letsencrypt-staging
  queryClusterIssuer: letsencrypt-staging
  tlsSecretName: custom-wikibase-tls
  queryHostname: query.localhost
  queryTlsSecretName: custom-wikibase-query-tls
  bodyLimitBytes: 10485760
  bodyMemoryBytes: 2097152
  rateLimitAverage: 120
  rateLimitBurst: 60

# Bounded one-shot jobs for qualification/rebuild workflows.
qualification:
  snapshot:
    enabled: false
    id: 00000000-0000-4000-8000-000000000010
    cursorTimestamp: "1970-01-01T00:00:00Z"
    cursorRcid: 0
    raceTest: false
    candidateGeneration: gen-b
  coordinator:
    enabled: false
    action: inspect
