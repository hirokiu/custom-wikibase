name: wfp-jwb-rdf-virtuoso
services:
  rdf-backend:
    image: openlink/virtuoso-opensource-7:7.2.17@sha256:0dbe1ab4fa0cb7bbafc1f6c0c2b0a5d6f22d918dbd17672f2ddb24580aa6756a
    environment:
      DBA_PASSWORD: ${JWB_RDF_ADMIN_PASSWORD:?required}
    ports: ["127.0.0.1:${JWB_RDF_HOST_PORT:-18890}:8890"]
    volumes: ["data:/database"]
    restart: unless-stopped
    labels:
      wikibase-federation.lodac.nii.ac.jp/disposable-local: "true"
volumes:
  data:
    labels:
      wikibase-federation.lodac.nii.ac.jp/disposable-local: "true"
