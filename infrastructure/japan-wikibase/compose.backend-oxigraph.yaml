services:
  backend-a: &backend
    image: oxigraph/oxigraph:0.5.7@sha256:fa3a660c0f5ec776472c0828309dec8a5410b7267e2dcac59ab7d7f29e10da28
    command: [serve, --location, /data, --bind, "0.0.0.0:7878"]
    volumes: [oxigraph-a:/data]
    networks: [backend-private]
  backend-b:
    <<: *backend
    volumes: [oxigraph-b:/data]
volumes:
  oxigraph-a: { labels: { japan-wikibase.local/owned: "true" } }
  oxigraph-b: { labels: { japan-wikibase.local/owned: "true" } }
