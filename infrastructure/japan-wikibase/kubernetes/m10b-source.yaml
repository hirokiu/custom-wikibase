apiVersion: v1
kind: ServiceAccount
metadata:
  name: japan-wikibase
  namespace: jwb-instance-local-01
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rdf-sync-worker
  namespace: jwb-instance-local-01
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: jwb-instance-local-01
spec:
  clusterIP: None
  selector: { "app.kubernetes.io/name": jwb-mariadb }
  ports: [{ name: mysql, port: 3306 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jwb-mariadb
  namespace: jwb-instance-local-01
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels: { "app.kubernetes.io/name": jwb-mariadb }
  template:
    metadata:
      labels: { "app.kubernetes.io/name": jwb-mariadb }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mariadb
          image: mariadb:10.11.14@sha256:dbe56e20372fc6d6b8e0e396866ba89c4c7f128c38c4f59aaa54d957db95790c
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
          envFrom: [{ secretRef: { name: jwb-mariadb } }]
          ports: [{ name: mysql, containerPort: 3306 }]
          readinessProbe: { exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }, periodSeconds: 3 }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jwb-uploads
  namespace: jwb-instance-local-01
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 256Mi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jwb-runtime-state
  namespace: jwb-instance-local-01
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 128Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: japan-wikibase
  namespace: jwb-instance-local-01
spec:
  selector: { "app.kubernetes.io/name": japan-wikibase }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: japan-wikibase
  namespace: jwb-instance-local-01
spec:
  replicas: 1
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } }
  selector:
    matchLabels: { "app.kubernetes.io/name": japan-wikibase }
  template:
    metadata:
      labels: { "app.kubernetes.io/name": japan-wikibase }
    spec:
      serviceAccountName: japan-wikibase
      automountServiceAccountToken: false
      containers:
        - name: wikibase
          image: wfp/japan-wikibase:m10b
          imagePullPolicy: Never
          envFrom: [{ secretRef: { name: japan-wikibase } }]
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: "/api.php?action=query&meta=siteinfo&format=json", port: http }
            initialDelaySeconds: 10
            periodSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 1536Mi }
          volumeMounts:
            - { name: uploads, mountPath: /var/www/html/images }
            - { name: runtime, mountPath: /var/lib/jwb }
      volumes:
        - { name: uploads, persistentVolumeClaim: { claimName: jwb-uploads } }
        - { name: runtime, persistentVolumeClaim: { claimName: jwb-runtime-state } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwb-job-runner
  namespace: jwb-instance-local-01
spec:
  replicas: 1
  selector:
    matchLabels: { "app.kubernetes.io/name": jwb-job-runner }
  template:
    metadata:
      labels: { "app.kubernetes.io/name": jwb-job-runner }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: job-runner
          image: wfp/japan-wikibase:m10b
          imagePullPolicy: Never
          args: ["jwb-job-runner"]
          envFrom: [{ secretRef: { name: japan-wikibase } }]
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: uploads, mountPath: /var/www/html/images }
            - { name: runtime, mountPath: /var/lib/jwb }
      volumes:
        - { name: uploads, persistentVolumeClaim: { claimName: jwb-uploads } }
        - { name: runtime, persistentVolumeClaim: { claimName: jwb-runtime-state } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: instance-default-deny
  namespace: jwb-instance-local-01
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: instance-dns
  namespace: jwb-instance-local-01
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { "kubernetes.io/metadata.name": kube-system } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wikibase-database
  namespace: jwb-instance-local-01
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [japan-wikibase, jwb-job-runner]
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { "app.kubernetes.io/name": jwb-mariadb } } }]
      ports: [{ protocol: TCP, port: 3306 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-ingress
  namespace: jwb-instance-local-01
spec:
  podSelector: { matchLabels: { "app.kubernetes.io/name": jwb-mariadb } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [japan-wikibase, jwb-job-runner]
      ports: [{ protocol: TCP, port: 3306 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wikibase-http-ingress
  namespace: jwb-instance-local-01
spec:
  podSelector: { matchLabels: { "app.kubernetes.io/name": japan-wikibase } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { "kubernetes.io/metadata.name": jwb-system } }
        - podSelector: {}
      ports: [{ protocol: TCP, port: 80 }]
