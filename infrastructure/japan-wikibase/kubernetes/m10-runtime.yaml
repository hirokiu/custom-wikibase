apiVersion: v1
kind: Service
metadata:
  name: controller-postgres
  namespace: jwb-system
spec:
  selector: { app.kubernetes.io/name: controller-postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: controller-postgres
  namespace: jwb-system
spec:
  serviceName: controller-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: controller-postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: controller-postgres }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16.9-bookworm@sha256:253815cf7579ffa05e1673d92e78d37273e61be0e4414e9a1449337d7925be94
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: jwb }
            - { name: POSTGRES_USER, value: jwb }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: controller-postgres, key: password } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe: { exec: { command: [pg_isready, -U, jwb, -d, jwb] }, periodSeconds: 2 }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 384Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 512Mi } }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: controller-postgres-migrate
  namespace: jwb-system
spec:
  backoffLimit: 10
  template:
    metadata: { labels: { app.kubernetes.io/name: controller-postgres-migrate } }
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: wfp/jwb-runtime:m10
          imagePullPolicy: Never
          command: [node, packages/database/src/migrate-cli.js, up]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: controller-postgres, key: url } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-router
  namespace: jwb-system
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: query-router } }
  template:
    metadata: { labels: { app.kubernetes.io/name: query-router } }
    spec:
      serviceAccountName: query-router
      containers:
        - name: router
          image: wfp/jwb-runtime:m10
          imagePullPolicy: Never
          command: [node, apps/query-router/src/main.js]
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: JWB_ROUTER_RUNTIME, value: kubernetes }
            - { name: JWB_ROUTER_BACKEND, value: virtuoso }
            - { name: JWB_ROUTER_QUERY_SERVICE_ID, value: jwb-local-query }
            - { name: JWB_ROUTER_PORT, value: "8080" }
            - name: JWB_ROUTER_DATABASE_URL
              valueFrom: { secretKeyRef: { name: controller-postgres, key: url } }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /livez, port: http }, periodSeconds: 5 }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: query-router
  namespace: jwb-system
spec:
  selector: { app.kubernetes.io/name: query-router }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: generation-coordinator
  namespace: jwb-system
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: generation-coordinator } }
  template:
    metadata: { labels: { app.kubernetes.io/name: generation-coordinator } }
    spec:
      serviceAccountName: generation-coordinator
      terminationGracePeriodSeconds: 15
      containers:
        - name: coordinator
          image: wfp/jwb-runtime:m10
          imagePullPolicy: Never
          command: [node, apps/rdf-generation-coordinator/src/main.js]
          ports: [{ name: health, containerPort: 8081 }]
          env:
            - { name: JWB_COORDINATOR_RUNTIME, value: kubernetes }
            - { name: JWB_COORDINATOR_PORT, value: "8081" }
            - { name: JWB_COORDINATOR_POLL_MS, value: "250" }
            - { name: JWB_COORDINATOR_LEASE_MS, value: "5000" }
            - name: JWB_COORDINATOR_POD_UID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
            - name: JWB_COORDINATOR_DATABASE_URL
              valueFrom: { secretKeyRef: { name: controller-postgres, key: url } }
          readinessProbe: { httpGet: { path: /readyz, port: health }, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /livez, port: health }, periodSeconds: 5 }
          resources:
            requests: { cpu: 25m, memory: 96Mi }
            limits: { cpu: 500m, memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: generation-coordinator
  namespace: jwb-system
spec:
  selector: { app.kubernetes.io/name: generation-coordinator }
  ports: [{ name: health, port: 8081, targetPort: health }]
